name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERMES_DISABLE_LAZY_INSTALLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Hermes host and test dependencies
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-source"
          git -C "$RUNNER_TEMP/hermes-source" checkout 46904a3b467f62616f5b3ee247adce30b1b277a0
          python -m pip install -e "$RUNNER_TEMP/hermes-source" pytest fastapi httpx build
          mkdir -p "$RUNNER_TEMP/hermes-home"
          printf 'HERMES_HOME=%s/hermes-home\nHERMES_KANBAN_HOME=%s/hermes-home\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run full suite including native fixtures
        run: |
          python -m pytest tests -q -o 'addopts=' --junitxml="$RUNNER_TEMP/results.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ['RUNNER_TEMP'] + '/results.xml').getroot()
          assert not root.findall('.//skipped'), 'CI must execute native fixtures, not skip them'
          PY
      - name: Validate plugin registration and dashboard syntax
        run: |
          hermes plugins doctor . --ci
          node --check dashboard/dist/index.js
      - name: Build source distribution and wheel
        run: python -m build --outdir "$RUNNER_TEMP/dist"
